      - id: M5-005
        title: "1x1/2x1/2x2 case-design notes and BOM"
        labels: [hardware, case, p2]
        notes:
          - "2026-11-25: the hardware scouting is in HARDWARE.md: Waveshare P4 64x32 panels, a Pi Zero 2 W, and Adafruit's Triple Bonnet. The user plans a 3D-printed frame. A quad is 512x256 mm, so it prints in sections; measure the panels when they arrive."
      - id: M5-006
        title: "Shared odds and market service for multiple boards (AWS)"
        labels: [cloud, odds, secrets, p3]
        notes:
          - "Direction from the user, 2026-11-01: once there are several boards, they pull odds from one source on our side rather than each making the same requests. It can also be the key store, so no board holds a secret."
          - "Go-ahead given 2026-11-02: heartbeat every 5 minutes, poll until 10 minutes after the latest, a table row per poll, boards pull the latest. Built in cloud/ (Lambda ZIP, DynamoDB, S3) and deployed 2026-11-15; tested on live NBA games, where 25 of 30 prices in the first run came off the keyed stream. PR #95's stream client moved there, so the Pi needs neither cryptography nor websockets."
          - "Board client done 2026-11-15: omni/providers/market_service.py behind WinProbFetcher, with a 5-minute heartbeat and a guard that ignores readings over 60 seconds old by the service's clock. Remaining: a token on each board (the physical board still runs pre-revival code), then CI deploys."
          - "Open: doubleheaders can use the exchange's league listing rather than a guessed slug, which needs real MLB games to confirm. Bovada stays out of the cloud by the user's call, 2026-11-02, given its terms (SOURCES.md): a board keeps fetching it directly for now, and a second board could take pregame odds from Polymarket's price instead, a moneyline with no run line."
          - "User's call, 2026-11-01: settle the permission question when sharing actually starts, not before."
          - "Check first: feeding other people's boards from one Polymarket US account is the redistribution question in clause 22 of its participant agreement, so get its written permission before building on that. See SOURCES.md."
          - "Round 4 M5 (before the NFL meter uses this path): the stream cache and REST path stamp an unchanged quote with each poll's time, and the board's freshness guard reads that stamp, so 'fresh' describes the poller, not the quote. Carry the quote's own time through MarketSample to the reading, and check quote age apart from poller liveness. Split board requests into batches of 30 or fewer, and rotate the poller's start so late games aren't starved."
          - "Round 4 L2: board_digest (store.py:179) reads token rows without ConsistentRead, while auth.py:3-4 says deleting a row revokes at once. Add ConsistentRead, then verify rotation and revocation before a private fleet. Full CI deploys wait until the service contract settles."

  - id: M6
    name: nfl_support
    goal: "First non-MLB league."
    notes:
      - "Started 2026-11-15 by the user's call, ahead of the A1 cutover: MLB is off until spring, and NFL Sundays are the live field for multi-game work."
      - "Legacy salvage (legacy/master data/nfl, renderers/nfl, Jan-Feb 2023): the play-banner spec and summarizers, banner tones, possession sprite and timeout pips carry over; its NFL.com private-API client does not. Its 14 recorded 2022 games stay a local test corpus."
    tasks:
      - id: M6-001
        title: "NFL live data provider (NFLMeta Builder, polled once in the cloud)"
        labels: [nfl, provider, cloud, p1]
        notes:
          - "Chosen 2026-11-15 over ESPN (Disney's terms bar automated access) and pricier licensed feeds; see SOURCES.md. Spike recorded with tools/nflmeta_record.py."
          - "2026-11-15: board-side provider (omni/providers/nflmeta.py) and single-game runner (python -m omni.app.football) ran PIT@CIN live on the 2x2: events, players' lines, pips derived from play text, injuries, kickoff and final states, 15-minute halftime hold."
          - "Remaining: poll once in the cloud (map NFLMeta game ids into the market slate); move the runner onto the Pi, where a full redraw costs ~93 ms (redraw only on change, or drop to ~5 fps); size the Free tier vs Builder (a game is ~1,500 requests at the recommended pace; Free allows 5,000 a month); poll off the render thread (a slow request stalls frames); try BALLDONTLIE GOAT's free trial (plays with wall-clock order) as the next provider to compare."
          - "Round 4 (2026-11-15): H1 (reads keep their pages; retries; refused cursors restart quietly) and H2 (a bounded drain after the final) fixed. `--play-feed every-poll` reads the feed each tick (about 2x the requests): a quarter of play rows sat 15 s+ in the feed before the on-change gating read them, worst 274 s."
          - "Round 4 plan: keep NFLMeta primary. Builder ($12: 75,000 requests and 250,000 rows a month) is an opt-in for regular Sundays and the user's call; Free is personal, non-commercial evaluation. Cloud polling is deferred: design the typed ingest boundary in A1a, and revisit when several devices are active and quota data justify it. Then keep the key server-side, give each game an atomic cursor commit, and settle the permitted remote display and retention before any family rollout."
          - "2026-11-25: the user's board runs Builder (since 2026-11-22), where the shared app reads every live game with its plays (#129). Polling once in the cloud waits on the friends'-boards data design (STATUS, Next 1)."
          - "Round 4: one BALLDONTLIE GOAT shadow trial on a nationally visible game, side by side with NFLMeta, comparing eight things: scoreboard delay, clock, scoring/try/reversal coverage, missing or late plays, possession after transfers, ordering and revision semantics, requests per game, and archive permission. A benchmark, not a commitment."
      - id: M6-002
        title: "NFL domain/events/cards"
        labels: [nfl, typing, rendering, p1]
        notes:
          - "Done 2026-11-15: FootballGameState, the live card on all three profiles (with kickoff and final states), NFL team registry, palette and logo tiles, and a play summarizer (omni/events/football.py). Remaining: pregame and big-play cards; check the summarizer against the legacy banner spec."
          - "Round 4: a minimal pregame card (teams, kickoff, records or odds when known) before mixed-league operation; the big-play card after revision-aware selection works, with small-panel goldens. Use the legacy summaries as a text corpus for terse banners and corner cases."
          - "The user's spec for the NFL pregame card (2026-11-16), modeled on MLB's: each club's record, with its standing as a detail line beside the top-line record (e.g. '1st, NFC South'); full-season statlines for each starting QB, where MLB's card has its probable pitchers; and betting lines. Until it exists, the single-game runner draws nothing before kickoff (seen on the MNF board, 2026-11-16). Design loop with goldens when it's built."
          - "Round 4: kickoff spot, halftime receiver and possession stay provisional until checked against real kickoff-enforcement text (a re-kick, a kick after a score or safety, an unknown team or spot). Playoff overtime needs rule fixtures before the postseason; until then its pips are hidden and no kickoff or halftime is invented."
      - id: M6-003
        title: "NFL red-zone/scoring/turnover priority"
        labels: [nfl, priority, p2]
        notes:
          - "2026-11-25: policy v2's interrupt classes cover majors and promotions. A play that swings the win probability 10 points is a win swing at any time (#129), and the first half's last two minutes get the late boost."
      - id: M6-004
        title: "Multi-league plumbing before NFL runs in the app"
        labels: [nfl, app, p1]
        status: done # H5 (#114, #115) and NFL on the shared board (#116, #118, #119)
        notes:
          - "ContestStore replaces all contests per update; the loop has one supervisor and one baseball pipeline; card keys use only the raw game id; favorites match bare abbreviations, which collide across leagues (DET, MIN, KC)."
          - "Round 4 H5 (gates mixed-league operation): partition snapshots by provider, league and coverage scope, and handle partial or failed reads without removals. Use full typed ids in storage, scheduling and market joins (14 abbreviations collide between the MLB and NFL registries). Make the contest-to-market mapping an explicit join, not a slug guess. Settle ProviderUpdate.events (L5): never filled or read today. Test simultaneous favorites, a repeated burst in one league, a final against a decisive play, and an outage in one league."

